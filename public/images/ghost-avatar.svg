<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="ghostGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="28" fill="#030c0e" />
  <circle cx="50" cy="50" r="44" stroke="#083344" stroke-width="2" fill="none" opacity="0.6" />
  <g transform="translate(18, 16)" filter="url(#glow)">
    <!-- Ghost Body -->
    <path d="M32 0 C14 0 0 14 0 32 C0 52 0 60 0 64 C4 60 10 58 14 62 C18 66 22 66 26 62 C30 58 34 58 38 62 C42 66 46 66 50 62 C54 58 60 60 64 64 C64 60 64 52 64 32 C64 14 50 0 32 0 Z" 
          fill="url(#ghostGrad)" opacity="0.95" />
    <!-- Glowing Eyes -->
    <ellipse cx="22" cy="28" rx="5" ry="7" fill="#030c0e" />
    <circle cx="24" cy="26" r="2" fill="#22d3ee" />
    <ellipse cx="42" cy="28" rx="5" ry="7" fill="#030c0e" />
    <circle cx="44" cy="26" r="2" fill="#22d3ee" />
    <!-- Cheeks -->
    <circle cx="16" cy="38" r="3" fill="#38bdf8" opacity="0.4" />
    <circle cx="48" cy="38" r="3" fill="#38bdf8" opacity="0.4" />
